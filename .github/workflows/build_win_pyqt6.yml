name: Сборка Windows (PyQt6)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-win"

permissions:
  contents: write

jobs:
  build-windows-pyqt6:
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r win/pyqt6/requirements.txt
          pip install requests pyinstaller

      - name: Собрать exe (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller --onefile --noconsole \
            --name "Bed.Mesh.Visualizer" \
            --icon "win/pyqt6/icon.ico" \
            --add-data "win/pyqt6/ui/locale;ui/locale" \
            --add-data "win/pyqt6/icon.ico;." \
            --add-data "webpanel/gkbridge;resources" \
            --add-data "webpanel/camera;resources/camera" \
            --add-data "win/pyqt6/resources/boot.sh;resources" \
            --runtime-tmpdir . \
            win/pyqt6/main.py

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: BedMeshVisualizer-Win-PyQt6
          path: dist/Bed.Mesh.Visualizer.exe

      - name: Удалить старые ассеты из релиза (до публикации)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const keepName = 'Bed.Mesh.Visualizer.exe';
            const legacyNames = new Set([
              'BedMeshVisualizer_Win_PyQt6.exe',
              'BedMeshVisualizer-Win-PyQt6.exe',
            ]);

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (e) {
              core.info(`Релиз для ${tag} не найден — пропускаем очистку.`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name)) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

      - name: Опубликовать релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Bed.Mesh.Visualizer.exe
          name: "${{ github.ref_name }}"
          body: |
            ## Bed Mesh Visualizer ${{ github.ref_name }}

            Обновление с большим набором новых возможностей (с версии 0.164).

            ### 🖥️ Программа
            - **Рекомендатор ускорений шейпера** — блок справа от коррекции стола: по данным
              `input_shaper` считает рекомендованный `max_accel` (K-коэффициенты Klipper).
            - **Редактирование температур калибровки стола** (`[leviQ3]`) во вкладке настроек.
            - **Анимированный переключатель** расширенных настроек, увеличенное окно, карта
              не сжимается на узком окне.

            ### 🔌 Принтер без флешки (вкладка «Расширенные настройки»)
            - **Постоянный SSH** и **веб-панель** — две независимые кнопки автозапуска.
            - **Откат** установок и **автоопределение** уже установленного при подключении.
            - Кнопка **«Обновить веб-панель»** — принудительная перезаливка.

            ### 📊 Веб-панель (http://&lt;ip&gt;:8088/)
            - **Управление печатью**: пауза/продолжить/стоп.
            - **Температуры**: задать/выключить нагрев сопла и стола.
            - **Время завершения** печати, всплывающие уведомления.
            - **Самообновление** панели с GitHub (своя версия, кнопка «⬆ Обновить»).
            - **📷 Живая камера принтера** (MJPEG) прямо в панели.

            ### 🛠️ Исправления
            - Авто-обновление программы: устранена ошибка загрузки Python DLL.
            - Обновление веб-панели: устранён ETXTBSY, корректный перезапуск моста.

            ## Скачать
            - `Bed.Mesh.Visualizer.exe` — Windows (64-bit)

      - name: Удалить старые ассеты из релиза (после публикации)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const keepName = 'Bed.Mesh.Visualizer.exe';
            const legacyNames = new Set([
              'BedMeshVisualizer_Win_PyQt6.exe',
              'BedMeshVisualizer-Win-PyQt6.exe',
            ]);

            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name)) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

