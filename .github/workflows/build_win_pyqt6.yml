name: Сборка Windows (PyQt6)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*-win"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Определить версию и состояние Windows-релиза
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      previous_tag_name: ${{ steps.release.outputs.previous_tag_name }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Создать tag и проверить состояние релиза
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("win/pyqt6/utils/version.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit("VERSION не найден в win/pyqt6/utils/version.py")
          print(match.group(1))
          PY
          )"
          release_tag="v${version}"

          # Для заметок берём диапазон через одну предыдущую Windows-версию:
          # текущая версия + предыдущий релиз. Это сохраняет важные изменения,
          # если промежуточный релиз был небольшим фиксом и позже удалён.
          previous_tag_name=""
          previous_release_tag=""
          seen_current="false"
          while IFS= read -r candidate; do
            [[ -z "${candidate}" ]] && continue
            if [[ "${candidate}" == "${release_tag}" ]]; then
              seen_current="true"
              continue
            fi
            if [[ "${seen_current}" == "true" ]]; then
              if [[ -z "${previous_release_tag}" ]]; then
                previous_release_tag="${candidate}"
              else
                previous_tag_name="${candidate}"
                break
              fi
            fi
          done < <(git tag --list 'v*-win' --sort=-version:refname)

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} не совпадает с версией ${release_tag}" >&2
              exit 1
            fi
          else
            if ! git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              git tag "${release_tag}" "${GITHUB_SHA}"
              git push origin "${release_tag}"
              echo "Создан tag ${release_tag} для ${GITHUB_SHA}"
            else
              echo "Tag ${release_tag} уже существует"
            fi
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>/dev/null || true)"
          has_asset="false"
          if [[ -n "${release_json}" ]]; then
            if jq -e '.draft == false and ([.assets[]?.name] | index("Bed.Mesh.Visualizer.exe")) != null and ([.assets[]?.name] | index("Bed.Mesh.Visualizer.exe.sha256")) != null' \
              <<<"${release_json}" >/dev/null; then
              has_asset="true"
            fi
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag_name=${previous_tag_name}" >> "${GITHUB_OUTPUT}"
          if [[ "${has_asset}" == "true" ]]; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "Windows-релиз ${release_tag} уже опубликован с EXE"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "Windows-релиз ${release_tag} требует сборки/публикации"
          fi

  build-windows-pyqt6:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r win/pyqt6/requirements.txt
          pip install requests pyinstaller

      - name: Собрать exe (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller --onefile --noconsole \
            --name "Bed.Mesh.Visualizer" \
            --icon "win/pyqt6/icon.ico" \
            --add-data "win/pyqt6/ui/locale;ui/locale" \
            --add-data "win/pyqt6/icon.ico;." \
            --add-data "webpanel/gkbridge;resources" \
            --add-data "webpanel/camera;resources/camera" \
            --add-data "win/pyqt6/resources/boot.sh;resources" \
            --runtime-tmpdir "%LOCALAPPDATA%\rkfsociety\BedMesh Visualizer\runtime" \
            --hidden-import OpenGL \
            --hidden-import OpenGL.platform.win32 \
            --hidden-import pyqtgraph.opengl \
            --collect-submodules OpenGL \
            win/pyqt6/main.py

      - name: Подготовить SHA-256 EXE
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path 'dist/Bed.Mesh.Visualizer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'dist/Bed.Mesh.Visualizer.exe.sha256' -Value $hash -NoNewline -Encoding ascii

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: BedMeshVisualizer-Win-PyQt6
          path: |
            dist/Bed.Mesh.Visualizer.exe
            dist/Bed.Mesh.Visualizer.exe.sha256

      - name: Удалить старые ассеты из релиза (до публикации)
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const keepName = 'Bed.Mesh.Visualizer.exe';
            const legacyNames = new Set([
              'BedMeshVisualizer_Win_PyQt6.exe',
              'BedMeshVisualizer-Win-PyQt6.exe',
            ]);

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (e) {
              core.info(`Релиз для ${tag} не найден — пропускаем очистку.`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name)) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

      - name: Опубликовать релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: |
            dist/Bed.Mesh.Visualizer.exe
            dist/Bed.Mesh.Visualizer.exe.sha256
          name: "${{ needs.prepare-release.outputs.release_tag }}"
          generate_release_notes: true
          previous_tag: ${{ needs.prepare-release.outputs.previous_tag_name }}

      - name: Удалить старые ассеты из релиза (после публикации)
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const keepName = 'Bed.Mesh.Visualizer.exe';
            const legacyNames = new Set([
              'BedMeshVisualizer_Win_PyQt6.exe',
              'BedMeshVisualizer-Win-PyQt6.exe',
            ]);

            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name)) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

