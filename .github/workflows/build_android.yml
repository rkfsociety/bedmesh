name: Сборка Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*-android"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Определить версию и состояние Android-релиза
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Создать tag и проверить состояние релиза
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'versionName\s*=\s*["\x27]([^"\x27]+)["\x27]', text)
          if not match:
              raise SystemExit("versionName не найден в android/app/build.gradle.kts")
          print(match.group(1))
          PY
          )"
          release_tag="v${version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} не совпадает с версией ${release_tag}" >&2
              exit 1
            fi
          else
            if ! git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              git tag "${release_tag}" "${GITHUB_SHA}"
              git push origin "${release_tag}"
              echo "Создан tag ${release_tag} для ${GITHUB_SHA}"
            else
              echo "Tag ${release_tag} уже существует"
            fi
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>/dev/null || true)"
          has_asset="false"
          if [[ -n "${release_json}" ]] && jq -e '.draft == false and ([.assets[]?.name] | index("BedMeshVisualizer.apk")) != null' <<<"${release_json}" >/dev/null; then
            has_asset="true"
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${has_asset}" == "true" ]]; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "Android-релиз ${release_tag} уже опубликован"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "Android-релиз ${release_tag} требует сборки/публикации"
          fi

  build-android:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Права на gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Собрать release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Подготовить артефакт
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BedMeshVisualizer.apk
          ls -la dist/BedMeshVisualizer.apk

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: BedMeshVisualizer-Android-APK
          path: dist/BedMeshVisualizer.apk

      - name: Удалить старые ассеты из релиза (до публикации)
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const keepName = 'BedMeshVisualizer.apk';
            const legacyNames = new Set([
              'app-release.apk',
              'bedmesh-release.apk',
            ]);

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (e) {
              core.info(`Релиз для ${tag} не найден — пропускаем очистку.`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name) || a.name.toLowerCase().endsWith('.apk')) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

      - name: Опубликовать релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: dist/BedMeshVisualizer.apk
          name: "${{ needs.prepare-release.outputs.release_tag }}"
          body: |
            ## Bed Mesh Visualizer ${{ needs.prepare-release.outputs.release_tag }}

            ### Новое
            - Псевдо-3D карта mesh (Canvas): переключатель 2D|3D
            - Координаты рабочей области и шаг разметки 25 мм
            - Редактор bed_mesh с подсказками, значениями по умолчанию и ограничением Lagrange для сеток больше 5×5
            - Drag — орбита, pinch — зум
            - Режим карты сохраняется

            Версия берётся из `android/app/build.gradle.kts` автоматически.

            ## Скачать
            - `BedMeshVisualizer.apk` — Android (release, подписан)

      - name: Удалить старые ассеты из релиза (после публикации)
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const keepName = 'BedMeshVisualizer.apk';
            const legacyNames = new Set([
              'app-release.apk',
              'bedmesh-release.apk',
            ]);

            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name)) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }
