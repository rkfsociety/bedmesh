name: Сборка Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-android"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Права на gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Собрать release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Подготовить артефакт
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BedMeshVisualizer.apk
          ls -la dist/BedMeshVisualizer.apk

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: BedMeshVisualizer-Android-APK
          path: dist/BedMeshVisualizer.apk

      - name: Удалить старые ассеты из релиза (до публикации)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const keepName = 'BedMeshVisualizer.apk';
            const legacyNames = new Set([
              'app-release.apk',
              'bedmesh-release.apk',
            ]);

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (e) {
              core.info(`Релиз для ${tag} не найден — пропускаем очистку.`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name) || a.name.toLowerCase().endsWith('.apk')) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

      - name: Опубликовать релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BedMeshVisualizer.apk
          name: "${{ github.ref_name }}"
          body: |
            ## Bed Mesh Visualizer ${{ github.ref_name }}

            ### Новое
            - Псевдо-3D карта mesh (Canvas): переключатель 2D|3D
            - Drag — орбита, pinch — зум
            - Режим карты сохраняется

            ## Скачать
            - `BedMeshVisualizer.apk` — Android (release, подписан)

      - name: Удалить старые ассеты из релиза (после публикации)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const keepName = 'BedMeshVisualizer.apk';
            const legacyNames = new Set([
              'app-release.apk',
              'bedmesh-release.apk',
            ]);

            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.data.id, per_page: 100,
            });

            for (const a of assets) {
              if (a.name === keepName) continue;
              if (legacyNames.has(a.name)) {
                core.info(`Удаляем старый ассет: ${a.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }
