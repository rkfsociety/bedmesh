name: Сборка macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-mac"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r win/pyqt6/requirements.txt
          pip install requests pyinstaller

      - name: Сборка и упаковка
        run: |
          python -m PyInstaller --windowed \
            --name "BedMeshVisualizer_Mac" \
            --add-data "mac/ui/locale:ui/locale" \
            --add-data "icon.png:." \
            --hidden-import=paramiko \
            --hidden-import=requests \
            --hidden-import OpenGL \
            --hidden-import OpenGL.platform.darwin \
            --hidden-import pyqtgraph.opengl \
            --collect-submodules OpenGL \
            mac/main.py

          brew install create-dmg

          mkdir -p dist/dmg
          create-dmg \
            --volname "Установщик Bed Mesh Visualizer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "BedMeshVisualizer_Mac.app" 200 190 \
            --hide-extension "BedMeshVisualizer_Mac.app" \
            --app-drop-link 600 185 \
            "dist/dmg/BedMeshVisualizer_Mac.dmg" \
            "dist/BedMeshVisualizer_Mac.app"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: BedMeshVisualizer-MacOS-DMG
          path: dist/dmg/*.dmg

      - name: Опубликовать релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dmg/BedMeshVisualizer_Mac.dmg
          name: "${{ github.ref_name }}"
          body: |
            ## Bed Mesh Visualizer ${{ github.ref_name }}

            ### Исправления
            - Проверка обновлений: последний релиз ***-mac**, не глобальный `/latest`.

            ### Из 0.170
            - 3D карта mesh (OpenGL / pyqtgraph).

            ## Скачать
            - `BedMeshVisualizer_Mac.dmg`