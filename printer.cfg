[virtual_sdcard]
enable_continue_print: 1 #默认开启断电续打功能
path: /useremain/app/gk/gcodes
white_lists:
    SNAPSHOT
    SET_VELOCITY_LIMIT
    SET_PRESSURE_ADVANCE
    SAVE_GCODE_STATE
    RESTORE_GCODE_STATE
    TUNING_TOWER
    SHAPER_CALIBRATE
    EXCLUDE_OBJECT_DEFINE
    EXCLUDE_OBJECT_START
    EXCLUDE_OBJECT_END
    EXCLUDE_OBJECT
    TEST_HUB
    CUT_FILAMENT

[filament_hub]
config_file: /userdata/app/gk/config/ams_config.cfg
serial:                         #/dev/ttyACM0,自动遍历
#serial: tcp@192.168.3.185:9999
v2_baud: 230400                  # 二代料盒波特率
v1_baud: 115200                  # 一代料盒波特率
baud: 115200			# 串口波特率
max_volumes: 16			# 料盒最大料卷数
cutter_pin: nozzle_mcu:PB1      # 切料开关
switch_pin: nozzle_mcu:PB0      # 断料检测开关
cruising_speed: 200             # 挤出机巡航速度，单位mm/s
# impact_position: 50              # 挤出机撞击切刀前的减速位置
impact_speed: 10                # 挤出机撞击切刀的速度，单位mm/s
cutter_position: 1.5		# 切刀相对y轴原点的偏移位置
cutter_position_after_trigger: 3.0 #切刀触发后再往前走3mm
min_cut_filament_current: 1.8       # 切料电流
min_cut_filament_hold_current: 1.0  # 切料保持电流
retract_travel_drip: 0.4            # 防止执行T指令时空驶漏料
retract_before_cut_leak: 2.0        # 执行切刀前的回抽
retract_after_cut_springback: 1.0	# 切刀后回弹前回抽长度
extrude_after_cut: 1.0	            # 利用旧料推动尾料接近喉管处

max_feed_retries: 3         # 进料最大重试次数
max_unwind_retries: 2       # 退料最大重试次数
max_filament_unloading_speed: 40 # 最大退料速度

fan_on_duration: 5          # 洗料开风扇冷却耗材时间
fan_off_duration: 2         # 洗料等待风扇停止时间

max_length_per_extrude: 150 # 分步洗料步长

action_timeout: 240.0		# 料盒执行退料和进料等操作的超时事件
# 料盒速度参数 - 根据料盒版本自动选择
v2_unwind_speed: 20          # 二代料盒退料速度
v2_feed_speed: 30            # 二代料盒进料速度
v1_unwind_speed: 20          # 一代料盒退料速度
v1_feed_speed: 30            # 一代料盒进料速度
# default_unwind_speed:20        # 退料时在触发断料开关后的料盒退料速度
# default_feed_speed: 30          # 进料时在触发断料开关前的料盒进料速度
unwind_speed_old_ace:15        # 旧料盒退料时在触发断料开关后的料盒退料速度

pre_sweep_position_x: 47         # 预洗料位置
pre_sweep_position_y: 230.0         # 预洗料位置
sweep_position_x: 47           # 洗料位置
sweep_position_y: 276.0           # 洗料位置
throw_position_x: 47           # 抛料位置
throw_position_y: 276.0           # 抛料位置
throw_impact_speed: 200          # 抛料撞击速度
cutter_retract_distance: 10.0    # 切刀回退距离(从max_y回退)，031机型默认40mm
shake_filament_speed:100        # 洗料过程扯料速度
sweep_speed: 7                # 挤出机擦除速度，单位mm/s
algo_const: 9.5                 #洗料算法系数
unwind_length_after_triggered: 1100
feed_max_length: 2600 #最大进料长度
unwind_max_length: 2600 #最大退料长度
enable_feed_assist: 1
enable_rfid: 1
delay_before_throw: 5
flush_volume_min: 107   # 最小冲刷体积
flush_volume_max: 800   # 最大冲刷体积
flush_multiplier: 1.5   # 冲刷乘数
flush_volume_ratio: 1.0   # 用户设置值的实际比例
sweep_retract_len:0.8 #洗料后回抽长度
sweep_reprint_extrude_len:0.3 #洗料后重新打印e轴吐料补偿长度
#为支持031 corexy机型添加以下配置
impact_position_x: 261      # 挤出机撞击切刀出发位置
impact_position_y: 25      # 挤出机撞击切刀出发位置
filament_tracker_enable: True
filament_calibrate: 1
recalibrate_period:7200.0 #强制整理耗材间隔时间(单位秒)
stuck_detection_length: 40#堵料检测长度
stuck_detection_count: 2#堵料检测次数
feed_after_force_extrude_len:50 #过码盘强行挤出距离

